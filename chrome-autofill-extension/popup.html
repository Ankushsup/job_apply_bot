<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 350px; margin: 0; padding: 14px; background: #f8fafc; color: #0f172a; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .title { font-size: 15px; font-weight: 800; color: #0f172a; }
    .sync-badge { font-size: 10.5px; padding: 3px 8px; border-radius: 12px; background: #ecfdf5; color: #065f46; font-weight: 700; border: 1px solid #a7f3d0; }
    .btn-fill {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff;
      font-size: 14px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3); margin-bottom: 10px;
    }
    .btn-fill:hover { opacity: 0.94; }
    #status { font-size: 12px; font-weight: 600; color: #059669; min-height: 18px; margin-bottom: 10px; text-align: center; }
    .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #64748b; margin: 8px 0 6px; letter-spacing: 0.4px; }
    .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .chip {
      background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 7px 9px;
      font-size: 11.5px; font-weight: 600; color: #1e293b; cursor: pointer; text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chip:hover { border-color: #2563eb; background: #eff6ff; }
    .chip-full { grid-column: 1 / -1; }
    .hint { font-size: 10.5px; color: #64748b; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ Resume Auto-Filler</div>
    <div class="sync-badge" id="syncBadge">Syncing...</div>
  </div>

  <button class="btn-fill" id="fillBtn">⚡ Auto-Fill All Fields on Page</button>
  <div id="status">Ready to fill any job application form</div>

  <div class="section-label">1-Click Copy Any Field</div>
  <div class="chips" id="copyGrid"></div>

  <div class="hint">Shortcut: <b>Alt + Shift + F</b> &bull; Auto-synced with resume.pdf</div>

  <script src="popup.js"></script>
</body>
</html>
